name: Test

on:
  push:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Arkstack
        run: |
          NPM_CONFIG_IGNORE_SCRIPTS=true pnpm install:arkstack
          cd test/arkstack-app
          echo "CWD: $(pwd)"
          pnpm install --ignore-workspace --no-frozen-lockfile --ignore-scripts
          pnpm prepare
          find .arkstack -type f | sort || echo ".arkstack does not exist"

      - name: Prepare Arkstack
        run: |
          cat >> test/arkstack-app/src/routes/web.ts << 'EOF'

          Router.get('/api', async ({ req }) => {
            return {
              title: 'Welcome to Arkstack',
              message: 'Server running — ready for requests',
              query: req.query
            }
          })
          EOF
          cd test/arkstack-app
          pnpm prepare

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        env:
          APP_URL: http://localhost:3000
          APP_PORT: 3000
        run: pnpm test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: arkstack-tmp/parasito
